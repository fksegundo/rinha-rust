services:
  api1:
    image: ghcr.io/fksegundo/rinha-rust-api:sha-59dd1b0
    pull_policy: always
    restart: always
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api1.sock
      RINHA_THREAD_POOL_SIZE: "256"
      RINHA_SEARCH_MODE: "key-first"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.39"
          memory: "160M"

  api2:
    image: ghcr.io/fksegundo/rinha-rust-api:sha-59dd1b0
    pull_policy: always
    restart: always
    network_mode: "none"
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api2.sock
      RINHA_THREAD_POOL_SIZE: "256"
      RINHA_SEARCH_MODE: "key-first"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.39"
          memory: "160M"

  lb:
    image: ghcr.io/fksegundo/rinha-api-lb:sha-0a30e49
    pull_policy: always
    restart: always
    user: "0:0"
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    environment:
      PORT: "9999"
      FD_UPSTREAMS: /sockets/api1.sock,/sockets/api2.sock
      WORKERS: "1"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.22"
          memory: "30M"
    depends_on:
      - api1
      - api2

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
