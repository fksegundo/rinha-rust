# Compose para branch submission de fksegundo/rinha-rust (teste Mac Mini via issue).
# Imagens: Docker Hub — tag sobrescrita por scripts/macmini-push.sh
services:
  api1:
    image: filonsegundo/rinha-dotnet:net-qw1
    cpuset: "0"
    restart: always
    logging:
      driver: "none"
    environment:
      RINHA_RUNTIME: "event-loop"
      RINHA_FD_SOCKET: /sockets/api1.sock
      RINHA_INDEX_PATH: /app/index/rinha-specialist.idx
      RINHA_PRETOUCH_INDEX: "1"
      RINHA_MLOCK_INDEX: "1"
      RINHA_CLIENT_FD_PRECONFIGURED: "1"
      RINHA_THREAD_POOL_SIZE: "1"
      RINHA_MAX_SECONDARY_PARTITIONS: "0"
      RINHA_BUSY_POLL_US: "50"
      RINHA_BUSY_POLL_BUDGET: "8"
      RINHA_PREFER_BUSY_POLL: "1"
      RINHA_EPOLL_TIMEOUT_MS: "1"
      DOTNET_gcServer: "0"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "169M"

  api2:
    image: filonsegundo/rinha-dotnet:net-qw1
    cpuset: "1"
    restart: always
    network_mode: "none"
    logging:
      driver: "none"
    environment:
      RINHA_RUNTIME: "event-loop"
      RINHA_FD_SOCKET: /sockets/api2.sock
      RINHA_INDEX_PATH: /app/index/rinha-specialist.idx
      RINHA_PRETOUCH_INDEX: "1"
      RINHA_MLOCK_INDEX: "1"
      RINHA_CLIENT_FD_PRECONFIGURED: "1"
      RINHA_THREAD_POOL_SIZE: "1"
      RINHA_MAX_SECONDARY_PARTITIONS: "0"
      RINHA_BUSY_POLL_US: "50"
      RINHA_BUSY_POLL_BUDGET: "8"
      RINHA_PREFER_BUSY_POLL: "1"
      RINHA_EPOLL_TIMEOUT_MS: "1"
      DOTNET_gcServer: "0"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "169M"

  lb:
    image: filonsegundo/rinha-dotnet-lb:net-qw1
    restart: always
    cpuset: "2,3"
    user: "0:0"
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "8M"
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m
