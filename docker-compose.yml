services:
  api1:
    image: ghcr.io/fksegundo/rinha-rust-api:latest
    restart: always
    hostname: api1
    cpuset: "0"
    logging:
      driver: "none"
    environment:
      API_SOCKET_PREFIX: /sockets/api1
      API_WORKERS: "1"
      RINHA_MLOCK_INDEX: "1"
      RINHA_PRETOUCH_INDEX: "1"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "169M"

  api2:
    image: ghcr.io/fksegundo/rinha-rust-api:latest
    restart: always
    hostname: api2
    cpuset: "1"
    logging:
      driver: "none"
    environment:
      API_SOCKET_PREFIX: /sockets/api2
      API_WORKERS: "1"
      RINHA_MLOCK_INDEX: "1"
      RINHA_PRETOUCH_INDEX: "1"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock: -1
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "169M"

  lb:
    image: ghcr.io/fksegundo/rinha-rust-lb:latest
    restart: always
    user: "0:0"
    cpuset: "2,3"
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    environment:
      API_SOCKETS: /sockets/api1.sock,/sockets/api2.sock
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.02"
          memory: "8M"
    depends_on:
      - api1
      - api2

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,uid=0,gid=0,mode=0777
