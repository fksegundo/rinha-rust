services:
  api1:
    image: filonsegundo/rinha-rust:no-pgo #tesst pgo - ghcr.io/fksegundo/rinha-rust-api:latest
    pull_policy: always
    cpuset: "0"
    restart: always
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api1.sock
      RINHA_FD_EVENTED: "1"
      RINHA_MLOCK_INDEX: "1"
      #RINHA_PRETOUCH_INDEX: "1"
      RINHA_FASTPATH: "1"
      RINHA_TREE_ROUTE: "1"
      RINHA_TREE_ROUTE_MARGIN: "1"
      RINHA_WARMUP_QUERIES: "4098"
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "170M"

  api2:
    image: filonsegundo/rinha-rust:no-pgo # ghcr.io/fksegundo/rinha-rust-api:latest
    pull_policy: always
    cpuset: "1"
    restart: always
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api2.sock
      RINHA_FD_EVENTED: "1"
      RINHA_MLOCK_INDEX: "1"
      #RINHA_PRETOUCH_INDEX: "1"
      RINHA_FASTPATH: "1"
      RINHA_TREE_ROUTE: "1"
      RINHA_TREE_ROUTE_MARGIN: "1"
      RINHA_WARMUP_QUERIES: "4098"
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "170M"

  lb:
    image: ghcr.io/fksegundo/rinha-api-lb:latest
    pull_policy: always
    restart: always
    cpuset: "2,3"
    user: "0:0"
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.06"
          memory: "10M"
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m
