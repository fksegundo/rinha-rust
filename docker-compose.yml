services:
  api1:
    image: ghcr.io/fksegundo/rinha-rust-api:sha-71791ed
    pull_policy: always
    restart: always
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api1.sock
      RINHA_FD_EVENTED: "1"
      RINHA_RECV_FD_BUDGET: ${RINHA_RECV_FD_BUDGET:-16}
      RINHA_ACCEPT_BUDGET: ${RINHA_ACCEPT_BUDGET:-64}
      RINHA_BUF_POOL_INIT: ${RINHA_BUF_POOL_INIT:-0}
      RINHA_EPOLL_TIMEOUT_MS: ${RINHA_EPOLL_TIMEOUT_MS:--1}
      RINHA_EPOLL_EDGE: ${RINHA_EPOLL_EDGE:-1}
      RINHA_BUSY_POLL_US: ${RINHA_BUSY_POLL_US:-0}
      RINHA_BUSY_POLL_BUDGET: ${RINHA_BUSY_POLL_BUDGET:-8}
      RINHA_PREFER_BUSY_POLL: ${RINHA_PREFER_BUSY_POLL:-1}
      RINHA_EARLY_EXIT_THRESHOLD: "2000000"
      RINHA_WARMUP_QUERIES: "256"
      RINHA_PAYLOAD_WARMUP_REQUESTS: "256"
      RINHA_THREAD_POOL_SIZE: "64"
      RINHA_PRETOUCH_INDEX: "1"
      RINHA_MLOCK_INDEX: "1"
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "172M"

  api2:
    image: ghcr.io/fksegundo/rinha-rust-api:sha-71791ed
    pull_policy: always
    restart: always
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api2.sock 
      RINHA_FD_EVENTED: "1"
      RINHA_RECV_FD_BUDGET: ${RINHA_RECV_FD_BUDGET:-16}
      RINHA_ACCEPT_BUDGET: ${RINHA_ACCEPT_BUDGET:-64}
      RINHA_BUF_POOL_INIT: ${RINHA_BUF_POOL_INIT:-0}
      RINHA_EPOLL_TIMEOUT_MS: ${RINHA_EPOLL_TIMEOUT_MS:--1}
      RINHA_EPOLL_EDGE: ${RINHA_EPOLL_EDGE:-1}
      RINHA_BUSY_POLL_US: ${RINHA_BUSY_POLL_US:-0}
      RINHA_BUSY_POLL_BUDGET: ${RINHA_BUSY_POLL_BUDGET:-8}
      RINHA_PREFER_BUSY_POLL: ${RINHA_PREFER_BUSY_POLL:-1}
      RINHA_EARLY_EXIT_THRESHOLD: "2000000"
      RINHA_WARMUP_QUERIES: "256"
      RINHA_PAYLOAD_WARMUP_REQUESTS: "256"
      RINHA_THREAD_POOL_SIZE: "64"
      RINHA_PRETOUCH_INDEX: "1"
      RINHA_MLOCK_INDEX: "1"
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "172M"

  lb:
    image: ghcr.io/fksegundo/rinha-api-lb:sha-36b3406
    pull_policy: always
    restart: always
    user: "0:0"
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.06"
          memory: "6M"
    depends_on:
      - api1
      - api2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
