services:
  api1:
    image: ghcr.io/fksegundo/rinha-rust-api:latest
    pull_policy: always
    restart: always
    network_mode: "none"
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api1.sock
      RINHA_SEARCH_MODE: "key-first"
    volumes:
      - sockets:/sockets
    ulimits:
      memlock: -1  
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160M"

  api2:
    image: ghcr.io/fksegundo/rinha-rust-api:latest
    pull_policy: always
    restart: always
    network_mode: "none"
    logging:
      driver: "none"
    environment:
      RINHA_FD_SOCKET: /sockets/api2.sock
      RINHA_SEARCH_MODE: "key-first"
    volumes:
      - sockets:/sockets
    ulimits:
      memlock: -1  
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160M"

  lb:
    image: ghcr.io/fksegundo/rinha-api-lb:latest
    pull_policy: always
    restart: always
    user: "0:0"
    ports:
      - "9999:9999"
    logging:
      driver: "none"
    environment:
      PORT: "9999"
      FD_UPSTREAMS: /sockets/api1.sock,/sockets/api2.sock
      WORKERS: "2"
    volumes:
      - sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30M"
    depends_on:
      - api1
      - api2

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
